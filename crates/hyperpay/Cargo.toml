[package]
name = "hyperpay"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "The easiest way to pay on Solana. Private, instant, agent-ready — built on MagicBlock ephemeral rollups and eSPL."
readme = "README.md"
repository = "https://github.com/magicblock-labs/hyperpay"
homepage = "https://github.com/magicblock-labs/hyperpay"
keywords = ["solana", "payments", "privacy", "magicblock", "espl"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
# Only solana-sdk is needed, for keys and transaction signing. RPC is two plain
# JSON-RPC calls over reqwest rather than solana-client, which keeps the
# dependency tree and compile time far smaller.
solana-sdk = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
