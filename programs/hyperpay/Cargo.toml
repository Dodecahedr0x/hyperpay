[package]
name = "hyperpay-program"
version = "0.1.2"
edition = "2021"
license = "MIT"

[lib]
name = "hyperpay"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.12"
sha2 = "0.10"
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-signer = "3"
solana-transaction = "3"
