name: Crate release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match crate version to release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' crates/hyperpay/Cargo.toml | head -n1)
          if [ "$tag" != "$version" ]; then
            echo "GitHub release tag '${GITHUB_REF_NAME}' does not match crate version '${version}'"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: crates/hyperpay
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
